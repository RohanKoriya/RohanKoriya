name: Update profile

on:
  schedule:
    - cron: "17 3 * * *"          # daily, 03:17 UTC (off-peak minute on purpose)
  workflow_dispatch:               # "Run workflow" button in the Actions tab
  repository_dispatch:             # optional: refresh when another repo pings this one
    types: [profile-refresh]
  push:
    branches: [main]
    paths:
      - "generator/**"
      - "profile.toml"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: read                   # least privilege by default; the job raises it below

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write              # only needed to commit the regenerated files
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Generate profile
        env:
          # Optional PROFILE_TOKEN (fine-grained PAT, read-only) adds private-contribution counts.
          # Without it the built-in, short-lived GITHUB_TOKEN is used.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python -m generator

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md generated
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi
