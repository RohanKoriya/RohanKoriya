name: Regenerate Profile OS

# Runs every 24 hours, on every push to main, and can be triggered
# manually from the Actions tab.
on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC daily
  push:
    branches: [main]
    paths:
      - "generator/**"
      - ".github/workflows/generate.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: profile-os-generate
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate dashboard SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          # Optional overrides — set these as repo variables/secrets to
          # customize without editing generator/config.py:
          GH_DISPLAY_NAME: ${{ vars.GH_DISPLAY_NAME }}
          GH_TITLE: ${{ vars.GH_TITLE }}
          GH_LOCATION: ${{ vars.GH_LOCATION }}
          GH_EMAIL: ${{ vars.GH_EMAIL }}
          GH_WEBSITE: ${{ vars.GH_WEBSITE }}
          GH_LINKEDIN: ${{ vars.GH_LINKEDIN }}
        run: python -m generator.main

      - name: Commit updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No visual changes to commit."
          else
            git commit -m "chore: regenerate profile OS dashboard [skip ci]"
            git push
          fi
