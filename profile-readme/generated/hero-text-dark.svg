<svg xmlns="http://www.w3.org/2000/svg" width="520" height="304" viewBox="0 0 520 304" role="img" aria-labelledby="t d"><title id="t">Rohan Koriya</title><desc id="d">Rohan Koriya, Software Developer. I build real-world web products with the MERN stack: MongoDB, Express, React and Node.js. I enjoy solving problems more than memorizing solutions, and every project teaches me something new.</desc><text x="0" y="70" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#58A6FF" font-weight="500" letter-spacing="2.4" >SOFTWARE DEVELOPER</text><text x="0" y="128" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-size="54" fill="#E6EDF3" font-weight="500" letter-spacing="-0.8" >Rohan Koriya</text><rect x="0" y="152" width="28" height="2" fill="#58A6FF"/><text x="0" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DA7B3" >I build real-world web products with the MERN stack: MongoDB,</text><text x="0" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DA7B3" >Express, React and Node.js. I enjoy solving problems more</text><text x="0" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DA7B3" >than memorizing solutions, and every project teaches me</text><text x="0" y="273" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#9DA7B3" >something new.</text></svg>
